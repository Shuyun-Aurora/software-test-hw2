[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
markers =
    tc01: login and inventory page smoke flow
    tc02: product sorting checks
    tc03: product detail page checks
    tc04: add product to cart checks
    tc05: cart page checks
    tc06: checkout and order completion checks
    tc07: sidebar navigation menu checks
    tc08: mobile Web UI checks with Appium and Android Chrome
